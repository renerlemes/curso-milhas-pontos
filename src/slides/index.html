<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/slides/">
  <title>Slides — Milhas &amp; Pontos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="deck-progress" id="deck-progress"></div>
  <main class="stage" id="stage" aria-live="polite"></main>
  <button type="button" class="deck-arrow prev" id="deck-prev" aria-label="Slide anterior">‹</button>
  <button type="button" class="deck-arrow next" id="deck-next" aria-label="Próximo slide">›</button>
  <nav class="deck-controls" aria-label="Controles da apresentação">
    <span class="deck-count" id="deck-count">0 / 0</span>
    <button type="button" class="deck-btn" id="deck-full" aria-label="Tela cheia">⛶</button>
  </nav>
  <script src="script.js"></script>
</body>
</html>
